    :root{
    --teal:#0E7C7B; --teal-deep:#0A5A59; --violet:#3E8471; --plum:#0A5A59; --berry:#C25A38;
    --ink:#26332C; --soft:#6E7268; --line:#E7DECB; --bg1:#F7F2E7; --bg2:#EFE7D5;
    --card:#FFFDF7; --good:#2F8F5B; --warn:#B0722A; --warn-soft:#F6EBD6;
    --sage:#7C8A5E; --clay:#C25A38; --clay-soft:#F6E6DD;
    --grad:linear-gradient(135deg,var(--teal),var(--teal-deep));
    --radius:16px; --shadow:0 12px 34px rgba(40,60,45,.09);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;line-height:1.5;padding-bottom:110px;}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px;}
  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(248,244,250,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);}
  .head-in{max-width:760px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:12px;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .mk{width:42px;height:42px;flex-shrink:0;}
  .brand b{font-size:23px;font-weight:800;letter-spacing:-.5px;}
  .brand .tg{font-size:12px;color:var(--soft);font-weight:600;margin-top:-3px;}
  .gear{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:19px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  /* screens */
  main{padding-top:18px;}
  .screen{display:none;animation:fade .25s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1.title{font-size:30px;font-weight:800;letter-spacing:-1px;margin-bottom:4px;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--violet);}
  .lede{color:var(--soft);font-size:15px;margin-bottom:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
  .card h2{font-size:18px;font-weight:700;margin-bottom:4px;}
  .card .csub{font-size:13px;color:var(--soft);margin-bottom:14px;}
  .grad{background:var(--grad);}
  .row{display:flex;gap:12px;}
  .row.wrap{flex-wrap:wrap;}
  .col{flex:1;}
  /* buttons */
  .btn{border:none;border-radius:999px;padding:13px 22px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(142,46,110,.25);}
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .btn-block{width:100%;}
  /* pills / toggles */
  .pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink);
    border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;user-select:none;}
  .pill.on{background:var(--grad);color:#fff;border-color:transparent;}
  .pill-row{display:flex;gap:10px;flex-wrap:wrap;}
  /* symptom sliders */
  .sym{margin:16px 0;}
  .sym .lab{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:8px;}
  .sym .lab .v{color:var(--plum);font-weight:700;}
  .segs{display:flex;gap:7px;}
  .seg{flex:1;height:30px;border-radius:8px;background:#F0EAF4;cursor:pointer;transition:.12s;border:none;}
  .seg.on{background:linear-gradient(135deg,var(--teal),var(--violet));}
  .seg.hi{background:linear-gradient(135deg,var(--berry),var(--plum));}
  .legend{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);margin-top:8px;font-weight:600;}
  /* inputs */
  input,select{font-family:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--violet);}
  label.fl{font-size:13px;font-weight:600;color:var(--soft);display:block;margin-bottom:6px;}
  .field{margin-bottom:14px;}
  /* stat tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;}
  .tile .t{font-size:12px;color:var(--soft);font-weight:600;}
  .tile .b{font-size:26px;font-weight:800;letter-spacing:-.5px;}
  .tile .d{font-size:12px;color:var(--soft);}
  /* dose ring */
  .dose-hero{display:flex;align-items:center;gap:18px;}
  .ring{width:96px;height:96px;flex-shrink:0;}
  /* list items */
  .item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .x{color:var(--berry);cursor:pointer;font-weight:700;font-size:13px;}
  .muted{color:var(--soft);font-size:13px;}
  .note{background:var(--warn-soft);border:1px solid #F1D9B4;border-radius:14px;padding:14px;font-size:13.5px;color:#7A4B18;line-height:1.5;}
  .note b{color:#633a12;}
  .good-note{background:#E6F5F1;border:1px solid #BDE6DC;border-radius:14px;padding:14px;font-size:13.5px;color:#155e51;}
  .chip-info{display:inline-block;background:#EFE7F3;color:var(--plum);font-weight:600;font-size:12px;padding:5px 12px;border-radius:999px;}
  .disc{font-size:12px;color:var(--soft);line-height:1.5;margin-top:8px;background:#F3EEF6;border-radius:12px;padding:12px 14px;}
  /* checklist */
  .check{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;border-bottom:1px solid var(--line);}
  .check:last-child{border-bottom:none;}
  .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;transition:.15s;}
  .check.on .box{background:var(--grad);border-color:transparent;}
  .check .ct{font-size:14.5px;font-weight:600;}
  .check .cs{font-size:12px;color:var(--soft);}
  /* bottom nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);z-index:30;}
  .tabs-in{max-width:760px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 6px 12px;}

let deferredInstallPrompt=null;

  e.preventDefault();
  deferredInstallPrompt=e;
  try{render();}catch(err){}
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  try{render();}catch(err){}
});
async function triggerInstall(){
  if(!deferredInstallPrompt){toast('Install isn\u2019t available yet in this browser \u2014 use the menu instructions below instead.');return;}

}

function last(arr){return arr.length?arr[arr.length-1]:null;}
function burden(c){if(!c||!c.sev)return null;const v=Object.values(c.sev);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*25):0;}
function doseStreak(){let s=0;const d=new Date();for(let i=0;i<60;i++){const ds=new Date(d);ds.setDate(d.getDate()-i);const key=ds.toISOString().slice(0,10);const rec=state.doses.find(x=>x.date===key);if(rec&&rec.taken){s++;}else if(i>0){break;}else{break;}}return s;}
function takenToday(){return state.doses.find(x=>x.date===today()&&x.taken);}

function maybeNotify(){

    if(r.lastNotifyDate===today())return;
    const now=new Date(), hm=(now.getHours()+'').padStart(2,'0')+':'+(now.getMinutes()+'').padStart(2,'0');

function buildShareCanvas(){
  const cs=state.checkins.filter(c=>burden(c)!=null).sort((a,b)=>a.date<b.date?-1:1);
  if(cs.length<3) return null;
  const byWeek={};
  cs.forEach(c=>{const w=weekStart(c.date);(byWeek[w]=byWeek[w]||[]).push(burden(c));});
  const weeks=[];let curd=new Date(weekStart(cs[0].date)+'T00:00');const end=new Date(weekStart(cs[cs.length-1].date)+'T00:00');
  while(curd<=end){const key=curd.toISOString().slice(0,10);const vals=byWeek[key]||[];weeks.push({key,med:median(vals)});curd.setDate(curd.getDate()+7);}

  x.fillStyle='#F7F2E7';x.fillRect(0,0,W,H);
  const rr=(px,py,pw,ph,r)=>{x.beginPath();x.moveTo(px+r,py);x.arcTo(px+pw,py,px+pw,py+ph,r);x.arcTo(px+pw,py+ph,px,py+ph,r);x.arcTo(px,py+ph,px,py,r);x.arcTo(px,py,px+pw,py,r);x.closePath();};
  rr(50,50,W-100,H-100,36);x.fillStyle='#FFFDF7';x.fill();x.strokeStyle='#E7DECB';x.lineWidth=3;x.stroke();
  x.fillStyle='#0E7C7B';x.font='800 30px Nunito, sans-serif';x.fillText('MY THYROID JOURNEY',110,160);
  x.fillStyle='#26332C';x.font='700 64px Fraunces, Georgia, serif';x.fillText('Symptom burden,',110,240);x.fillText('week by week',110,315);
  x.fillStyle='#6E7268';x.font='600 32px Nunito, sans-serif';x.fillText(fmt(cs[0].date)+' to '+fmt(cs[cs.length-1].date)+' · '+cs.length+' check-ins',110,370);
  const cx0=110,cy0=440,cw=W-220,ch=460;
  x.strokeStyle='#E7DECB';x.lineWidth=2;x.fillStyle='#6E7268';x.font='600 24px Nunito, sans-serif';
  [0,50,100].forEach(v=>{const yy=cy0+ch-(v/100)*ch;x.beginPath();x.moveTo(cx0,yy);x.lineTo(cx0+cw,yy);x.stroke();x.fillText(String(v),cx0+cw+14,yy+8);});
  const XX=i=>cx0+(shown.length===1?cw/2:i/(shown.length-1)*cw);
  const YY=v=>cy0+ch-(v/100)*ch;
  const pts=shown.map((w,i)=>w.med!=null?{x:XX(i),y:YY(w.med)}:null).filter(Boolean);
  if(pts.length>1){
    x.beginPath();x.moveTo(pts[0].x,cy0+ch);pts.forEach(p=>x.lineTo(p.x,p.y));x.lineTo(pts[pts.length-1].x,cy0+ch);x.closePath();
    x.fillStyle='rgba(14,124,123,0.14)';x.fill();
    x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.strokeStyle='#0E7C7B';x.lineWidth=7;x.lineJoin='round';x.stroke();
  }
  pts.forEach(p=>{x.beginPath();x.arc(p.x,p.y,11,0,7);x.fillStyle='#0E7C7B';x.fill();x.beginPath();x.arc(p.x,p.y,5,0,7);x.fillStyle='#FFFDF7';x.fill();});
  let ty=cy0+ch+90;
  x.fillStyle='#26332C';x.font='700 40px Nunito, sans-serif';
  if(dw.length>=2){
    const f=dw[0].med,l=dw[dw.length-1].med,diff=l-f;

    x.fillStyle='#6E7268';x.font='600 32px Nunito, sans-serif';

    ty+=48;

  const ts=state.labs.filter(v=>v.tsh!=null&&v.tsh!=='').map(v=>parseFloat(v.tsh)).filter(v=>!isNaN(v));

    ty+=84;

function flareCheck(){
  const cs=state.checkins.filter(c=>burden(c)!=null).sort((a,b)=>a.date<b.date?-1:1);
  const recent=cs.filter(c=>daysBetween(c.date,today())<=3);
  if(recent.length<2) return null;
  const base=cs.filter(c=>{const dd=daysBetween(c.date,today());return dd>3&&dd<=31;});
  if(base.length<5) return null;
  const bvals=base.map(burden).sort((a,b)=>a-b);
  const bmed=median(bvals);
  const q3=bvals[Math.min(bvals.length-1,Math.floor(bvals.length*0.75))];
  const spread=Math.max(10,q3-bmed);
  const rmed=median(recent.map(burden));
  if(rmed<bmed+spread) return null;
  const rising=[];
  SYMPTOMS.forEach(sy=>{
    const bv=base.map(c=>c.sev&&c.sev[sy.k]).filter(v=>v!=null);
    const rv=recent.map(c=>c.sev&&c.sev[sy.k]).filter(v=>v!=null);
    if(bv.length>=3&&rv.length>=2&&median(rv)-median(bv)>=1)rising.push(sy.label);
  });
  return {rmed,bmed,rising:rising.slice(0,3)};
}

function expBaseline(){

  let note='the 4 weeks before';
  if(win.length<3){win=cs;note='your earlier check-ins';}

function expDuring(){
  const ex=state.experiment; if(!ex) return {med:null,n:0};
  const cs=state.checkins.filter(c=>burden(c)!=null&&c.date>=ex.started);
  return {med:cs.length?median(cs.map(burden)):null,n:cs.length};
}

function expVerdict(base,dur){

  const d=dur.med-base.med;
  if(d<=-8) return {tone:'good',head:'Lower burden during the change',txt:`Typical burden was ${base.med}/100 before and ${dur.med}/100 during, ${Math.abs(d)} points lower. Encouraging, but not proof: other things changed over these weeks too. If it also felt real, it is worth keeping and mentioning to your clinician.`};
  if(d>=8) return {tone:'warn',head:'Higher burden during the change',txt:`Typical burden ran ${dur.med}/100 during versus ${base.med}/100 before. That does not necessarily mean the change caused it, but there is no sign it helped.`};
  return {tone:'ask',head:'No clear difference',txt:`Typical burden was ${base.med}/100 before and ${dur.med}/100 during, too close to call. That is a genuinely useful answer: it can free you from an effortful change that was not earning its keep.`};

function median(a){if(!a.length)return null;const x=[...a].sort((m,n)=>m-n);const i=Math.floor(x.length/2);return x.length%2?x[i]:Math.round((x[i-1]+x[i])/2);}

function overlayCard(){

function correlationCard(){
  const cs=state.checkins.filter(c=>Array.isArray(c.triggers)&&burden(c)!=null);
  if(cs.length<4)return '';
  const rows=[];
  TRIGGERS.forEach(t=>{
    const withT=cs.filter(c=>c.triggers.includes(t.k)).map(burden);
    const without=cs.filter(c=>!c.triggers.includes(t.k)).map(burden);
    if(withT.length>=2&&without.length>=2){
      const a=withT.reduce((x,y)=>x+y,0)/withT.length;
      const b=without.reduce((x,y)=>x+y,0)/without.length;
      const diff=Math.round(a-b);
      if(diff>=5)rows.push({t,diff,n:withT.length});
    }
  });
  if(!rows.length)return '';
  rows.sort((x,y)=>y.diff-x.diff);
  return `<div class="card"><h2>What links to tougher days</h2>

/* --- "Safe to take now?" in-the-moment dose helper --- */
let safeWhat=null, safeAgo=null;
const SAFE_WHAT=[
  {k:'none',   e:'\ud83c\udf19', n:'Nothing since last night', gap:0},
  {k:'food',   e:'\ud83c\udf73', n:'Food', gap:60},
  {k:'coffee', e:'\u2615', n:'Coffee', gap:60},
  {k:'dairy',  e:'\ud83e\udd5b', n:'Milk or dairy', gap:60},
  {k:'mineral',e:'\ud83d\udc8a', n:'Calcium, iron or magnesium', gap:240},
  {k:'antacid',e:'\ud83e\uddef', n:'Antacid', gap:240},
];
const SAFE_AGO=[{k:0,n:'Just now'},{k:30,n:'About 30 min ago'},{k:60,n:'About 1 hour ago'},{k:120,n:'About 2 hours ago'},{k:240,n:'4+ hours ago'}];
function minTxt(m){return m>=60?(m/60)+(m===60?' hour':' hours'):m+' minutes';}
function setSafeWhat(k){safeWhat=(safeWhat===k?null:k);if(safeWhat==='none')safeAgo=null;renderMeds();}
function setSafeAgo(k){safeAgo=(safeAgo===k?null:k);renderMeds();}
function safeVerdict(){
  if(!safeWhat) return null;
  const w=SAFE_WHAT.find(x=>x.k===safeWhat);
  if(w.k==='none') return {tone:'good', head:'Good to go', body:'An empty stomach is the ideal moment. Take it with plain water, then keep food and coffee 30 to 60 minutes away on the other side.'};
  if(safeAgo==null) return {tone:'ask', head:'How long ago?', body:'Pick a time above and HashiHelper will work out whether now is a good moment.'};
  const left=w.gap-safeAgo;
  if(left<=0) return {tone:'good', head:'Good moment to take it', body:`That was long enough ago to clear the usual ${minTxt(w.gap)} gap for ${w.n.toLowerCase()}. Take it with plain water, and remember the same gaps apply on the other side of the dose.`};
  if(w.gap===60&&safeAgo===30) return {tone:'warn', head:'Borderline', body:'30 minutes is the usual minimum for food and drink; a full hour is better. If you do take it now, keep tomorrow the same, consistency matters more than perfection.'};
  return {tone:w.gap>=240?'clay':'warn', head:`Better to wait about ${minTxt(left)} more`, body:`${w.n} can ${w.gap>=240?'bind levothyroxine in the gut and block a chunk of the dose':'noticeably reduce how much of the dose you absorb'}. Waiting out the full ${minTxt(w.gap)} keeps absorption steady. Next time, taking your levo first and having this ${minTxt(w.gap)} later works too.`};
}

const LABREF={

const LABOPT={ tsh:{lo:0.5,hi:2.5}, ft4:{lo:15,hi:22}, ft3:{lo:5.0,hi:6.8}, fer:{lo:70,hi:150} };
function labView(){return state.settings&&state.settings.labView==='optimal'?'optimal':'standard';}
function activeRef(key){const r=LABREF[key];if(!r)return null;if(labView()==='optimal'&&LABOPT[key])return Object.assign({},r,LABOPT[key]);return r;}
const LABCOL={in:'var(--good)',normal:'var(--good)',above:'var(--clay)',elevated:'var(--clay)',below:'var(--warn)'};
function labTxt(st){const opt=labView()==='optimal';
  return ({in:opt?'in optimal range':'in range', normal:'normal', above:opt?'above optimal':'above range', elevated:'elevated', below:opt?'below optimal':'below range'})[st];}
function labStatus(key,v){const r=activeRef(key);if(!r||v==null||isNaN(v))return null;
  if(r.type==='band'){if(v<r.lo)return 'below';if(v>r.hi)return 'above';return 'in';}
  return v>r.hi?'elevated':'normal';}
function setLabView(v){state.settings.labView=v;save();renderLabs();}
function labChart(key){
  const r=activeRef(key);
  const pts=state.labs.filter(x=>x[key]!=null&&x[key]!=='').map(x=>({date:x.date,v:parseFloat(x[key])})).filter(p=>!isNaN(p.v)).sort((a,b)=>a.date<b.date?-1:1);
  if(!pts.length) return '';
  const W=320,H=118,padL=8,padR=8,padT=12,padB=20,iw=W-padL-padR,ih=H-padT-padB;
  const vals=pts.map(p=>p.v);
  let lo=Math.min(...vals, r.type==='band'?r.lo:0);
  let hi=Math.max(...vals, r.hi);
  const span=(hi-lo)||1, yp=span*0.12; lo-=yp; hi+=yp;
  const X=i=>padL+(pts.length===1?iw/2:i/(pts.length-1)*iw);
  const Y=v=>padT+(1-(v-lo)/(hi-lo))*ih;
  let band,refLines;
  if(r.type==='band'){band=`<rect x="${padL}" y="${Y(r.hi).toFixed(1)}" width="${iw}" height="${(Y(r.lo)-Y(r.hi)).toFixed(1)}" fill="var(--teal)" opacity="0.12"/>`;
    refLines=[r.lo,r.hi].map(v=>`<line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${padL+iw}" y2="${Y(v).toFixed(1)}" stroke="var(--teal)" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>`).join('');
  }else{band=`<rect x="${padL}" y="${Y(r.hi).toFixed(1)}" width="${iw}" height="${(padT+ih-Y(r.hi)).toFixed(1)}" fill="var(--teal)" opacity="0.12"/>`;
    refLines=`<line x1="${padL}" y1="${Y(r.hi).toFixed(1)}" x2="${padL+iw}" y2="${Y(r.hi).toFixed(1)}" stroke="var(--teal)" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>`;}
  const line=pts.length>1?`<polyline fill="none" stroke="var(--ink)" stroke-width="2" opacity="0.5" points="${pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}"/>`:'';
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" fill="${LABCOL[labStatus(key,p.v)]}" stroke="#fff" stroke-width="1.5"/>`).join('');
  const lastp=pts[pts.length-1], st=labStatus(key,lastp.v);
  let eng;
  if(pts.length>1){const f=pts[0].v; eng = f===lastp.v?`Holding at ${lastp.v} ${r.unit}, currently ${labTxt(st)}.`:`Moved ${lastp.v<f?'down':'up'} from ${f} to ${lastp.v} ${r.unit}, now ${labTxt(st)}.`;}
  else eng=`One result so far: ${lastp.v} ${r.unit}, ${labTxt(st)}.`;
  return `<div style="margin:18px 0 4px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <b style="font-size:14.5px">${r.name}</b>
      <span style="font-size:12px;font-weight:700;color:#fff;background:${LABCOL[st]};padding:3px 10px;border-radius:999px">${lastp.v} · ${labTxt(st)}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:6px" preserveAspectRatio="xMidYMid meet">
      ${band}${refLines}${line}${dots}
      <text x="${padL}" y="${H-6}" font-size="9" fill="var(--soft)">${fmt(pts[0].date)}</text>
      ${pts.length>1?`<text x="${padL+iw}" y="${H-6}" font-size="9" fill="var(--soft)" text-anchor="end">${fmt(lastp.date)}</text>`:''}
    </svg>
    <div class="muted" style="font-size:13px">${eng}</div>
  </div>`;
}

function visitQuestions(){
  const c=last(state.checkins), l=last(state.labs), qs=[];
  const push=(q,why)=>qs.push({q,why});
  const recent=state.checkins.slice(-4).map(burden).filter(x=>x!=null);
  const b=recent.length?recent.reduce((a,x)=>a+x,0)/recent.length:null;
  const topSym=c?SYMPTOMS.map(s=>({label:s.label,v:c.sev[s.k]||0})).filter(x=>x.v>=2).sort((a,b)=>b.v-a.v):[];
  const tshv=l&&l.tsh!=null&&l.tsh!==''?parseFloat(l.tsh):null;
  const tshIn=tshv!=null&&tshv>=0.4&&tshv<=4.0;
  if(tshv!=null&&tshIn&&b!=null&&b>=35&&topSym.length){
    push(`My TSH is in range (${l.tsh}) but I still get ${topSym[0].label.toLowerCase()}. Could we look at Free T3, Free T4, ferritin, B12 or vitamin D?`,'Some people still have symptoms with a normal TSH, and these extra markers can add context.');
  }
  if(tshv!=null&&tshv>4.0) push(`My most recent TSH (${l.tsh}) is above the lab range. Should my levothyroxine dose be reviewed?`,'A raised TSH can point to under-replacement.');
  if(tshv!=null&&tshv<0.4) push(`My most recent TSH (${l.tsh}) is below the lab range. Could I be slightly over-replaced?`,'A low TSH can point to over-replacement for some people.');
  const dc=last(state.dosechanges);
  if(dc){const since=daysBetween(dc.date,today());const testedAfter=l&&l.date>=dc.date;
    if(since>=42&&!testedAfter) push(`It has been about ${Math.round(since/7)} weeks since my dose changed and I have not retested. Should I have bloods now?`,'Levels usually settle by 6 to 8 weeks, a common point to recheck.');}
  if(l&&((l.tpo&&parseFloat(l.tpo)>34)||(l.tg&&parseFloat(l.tg)>115))) push('My thyroid antibodies are raised. What does that mean for me over time?','Understanding your antibodies helps you know what to watch for.');
  const lowNut=[['fer','ferritin'],['b12','B12'],['vitd','vitamin D']].filter(([k])=>{const v=l&&l[k]!=null&&l[k]!==''?parseFloat(l[k]):null;return v!=null&&!isNaN(v)&&v<LABREF[k].lo;}).map(([,n])=>n);
  if(lowNut.length) push(`My ${lowNut.join(' and ')} ${lowNut.length>1?'are':'is'} below the usual range. Could that be adding to my symptoms, and should we treat it?`,'Low iron stores, B12 or vitamin D can each cause thyroid-like symptoms of their own.');
  const d=state.doses.slice(-14);const adh=d.length?d.filter(x=>x.taken).length/d.length:null;
  if(adh!=null&&adh<0.85) push('I sometimes miss or mistime my dose. Any tips to make it more consistent?','Timing and consistency affect how well levothyroxine works.');
  if(state.profile.when==='morning'&&b!=null&&b>=35) push('Would taking my levothyroxine at bedtime, or further from food and coffee, help absorption?','Dosing away from food and some supplements can improve absorption.');
  if(qs.length<2){push('Do my latest results suggest my current dose still fits?','A useful general check-in question.');push('Are there any tests or changes you would suggest for me right now?','Keeps the conversation open.');}
  return `<div class="card"><h2>Questions to raise</h2>
    <div class="csub">Suggested from your own data. Tick the ones you want to bring up.</div>
    ${qs.slice(0,6).map(o=>`<div class="check" onclick="this.classList.toggle('on')"><div class="box"></div><div><div class="ct">${o.q}</div><div class="cs">${o.why}</div></div></div>`).join('')}
    <div class="disc">These are prompts based on what you have logged, not medical advice. Your clinician has the full picture.</div>
  </div>`;
}
function captureVisit(){

    tsh:(l&&l.tsh!=null&&l.tsh!=='')?parseFloat(l.tsh):null, tshDate:l?l.date:null,

}

function visitDelta(){
  const v=state.lastVisit; if(!v) return '';
  const rows=[];
  const l=last(state.labs);
  const curT=(l&&l.tsh!=null&&l.tsh!=='')?parseFloat(l.tsh):null;
  if(curT!=null&&v.tsh==null) rows.push(['TSH',`${curT}`,'first recorded result']);
  else if(curT!=null&&v.tsh!=null){
    if(l.date===v.tshDate&&curT===v.tsh) rows.push(['TSH',`${curT}`,'no new result yet']);
    else rows.push(['TSH',`${v.tsh} \u2192 ${curT}`,curT<v.tsh?'down':curT>v.tsh?'up':'no change']);
  }
  const recent=state.checkins.slice(-4).map(burden).filter(x=>x!=null);
  const curB=recent.length?median(recent):null;
  if(v.burden!=null&&curB!=null){const d=curB-v.burden;
    rows.push(['Symptom burden',`${v.burden} \u2192 ${curB}/100`,Math.abs(d)<4?'about steady':(d<0?'better by '+Math.abs(d)+' points':'up by '+d+' points')]);}
  const dcs=state.dosechanges.filter(x=>x.date>v.date);
  if(dcs.length) rows.push(['Dose',(v.dose?v.dose+' \u2192 ':'')+dcs.map(x=>x.dose).join(' \u2192 '),`changed ${dcs.length===1?'once':dcs.length+' times'}`]);
  else if(v.dose) rows.push(['Dose',v.dose,'unchanged']);
  const nc=state.checkins.filter(c=>c.date>v.date).length;

}

function tips(){
  const p=state.profile, out=[];
  if(p.stage==='Newly diagnosed') out.push(['🌱','Newly diagnosed','Levothyroxine is usually a long-term, once-daily hormone replacement. It can take several weeks and a dose tweak or two before you feel the benefit, and that is normal.']);
  if(p.stage==='Not yet on medication') out.push(['🔎','Being watched','Some people with positive antibodies are monitored before starting treatment. Keep logging symptoms and labs so any change is easy to show your doctor.']);
  const dc=last(state.dosechanges);
  if(dc||p.stage==='Adjusting my dose') out.push(['🗓️','After a dose change','Thyroid levels are usually rechecked around 6 to 8 weeks after a dose change, because they take time to settle. Ask your clinician when your next test is due.']);
  if(p.conditions.includes('Coeliac disease')) out.push(['🌾','Coeliac + Hashimoto\'s','With coeliac disease, a strict gluten-free diet is important, and it can also improve how well your levothyroxine is absorbed.']);
  else out.push(['🌾','Thinking about gluten?','If you want to try gluten-free, ask to be tested for coeliac disease first: going gluten-free beforehand can hide it.']);
  if(p.conditions.includes('B12 / pernicious anaemia')||p.goals.includes('Less fatigue')) out.push(['🩸','Fatigue has layers','Low iron, ferritin, vitamin D and B12 are common alongside Hashimoto\'s and can cause fatigue even when thyroid levels look fine. Worth asking your GP to check.']);
  if(p.pregnancy) out.push(['🤰','Pregnancy matters','If you are pregnant or planning to be, your levothyroxine dose often needs increasing and closer monitoring. Make this a priority conversation with your doctor as early as possible.']);
  if(p.goals.includes('Remember my meds')) out.push(['⏰','Build the habit','Keep your tablet by your bed or toothbrush and take it at the same time daily. Consistency matters more than the exact hour.']);
  out.push(['🧪','Before your next blood test','If you take biotin (often in hair/skin supplements), it can skew thyroid results. Many people pause it 1 to 2 weeks before testing, so check with your clinician.']);
  return out;
}

function matchesDiet(m){const d=state.diet;return (!d.gf||m.gf)&&(!d.df||m.df)&&(!d.veg||m.veg)&&(!d.nf||m.nf)&&(!d.ff||m.ff);}
function slotPool(slot){const a=MEALS.filter(m=>m.slot===slot&&matchesDiet(m));return a.length?a:MEALS.filter(m=>m.slot===slot);}
function toggleDiet(k){state.diet[k]=!state.diet[k];save();if(state.plan)generatePlan();else renderDiet();}
function generatePlan(){
  const pick=(arr,used)=>{const avail=arr.filter(m=>!used.includes(m.name));const src=avail.length?avail:arr;const m=src[Math.floor(Math.random()*src.length)];used.push(m.name);return m;};
  const pb=slotPool('Breakfast'),pl=slotPool('Lunch'),pd=slotPool('Dinner'),psn=slotPool('Snack');
  const days=[];const ub=[],ul=[],ud=[],us=[];
  const n=state.planLength===14?14:7;
  for(let i=0;i<n;i++){days.push({b:pick(pb,ub),l:pick(pl,ul),d:pick(pd,ud),s:pick(psn,us)});
    if(ub.length>=pb.length)ub.length=0; if(ul.length>=pl.length)ul.length=0; if(ud.length>=pd.length)ud.length=0; if(us.length>=psn.length)us.length=0;}
  state.plan={created:today(),days};state.shopping={};save();renderDiet();
}
function setPlanLength(n){state.planLength=n;save();if(state.plan)generatePlan();else renderDiet();}
function swapMeal(i,slot){
  const names={b:'Breakfast',l:'Lunch',d:'Dinner',s:'Snack'};
  const pool=slotPool(names[slot]);const cur=state.plan.days[i][slot].name;
  const usedCol=state.plan.days.map(d=>d[slot].name);
  let avail=pool.filter(m=>m.name!==cur&&!usedCol.includes(m.name));
  if(!avail.length)avail=pool.filter(m=>m.name!==cur);
  if(!avail.length)avail=pool;
  state.plan.days[i][slot]=avail[Math.floor(Math.random()*avail.length)];
  save();renderDiet();
}

    else{g.style.display='';g.classList.remove('open');}
  });
  const empty=document.querySelector('.food-empty');if(empty)empty.style.display=(searching&&shown===0)?'':'none';
}

/* ---------------- settings / modal ---------------- */
function openSettings(){
  document.getElementById('modal').innerHTML=`
    <h2>Settings</h2>
    <div class="field"><label class="fl">Your name (optional)</label><input value="${state.profile.name}" oninput="state.profile.name=this.value;save()"/></div>
    <label class="fl">Weight unit</label>
    <div class="pill-row" style="margin-bottom:20px">
      <span class="pill ${state.settings.unit==='kg'?'on':''}" onclick="state.settings.unit='kg';save();openSettings()">kg</span>
      <span class="pill ${state.settings.unit==='lb'?'on':''}" onclick="state.settings.unit='lb';save();openSettings()">lb</span>
    </div>
    <button class="btn btn-ghost btn-block" style="margin-bottom:10px" onclick="backup()">⬇️ Back up to a file</button>
    <button class="btn btn-ghost btn-block" style="margin-bottom:10px" onclick="document.getElementById('restore').click()">⬆️ Restore from a file</button>
    <input id="restore" type="file" accept="application/json" class="hidden" onchange="restore(this.files[0])"/>
    <button class="btn btn-ghost btn-block" style="margin-bottom:10px" onclick="closeModal();loadDemo()">🧪 Load example data</button>
    <button class="btn btn-ghost btn-block" style="margin-bottom:16px;color:var(--berry)" onclick="if(confirm('Erase all your data on this device? This cannot be undone.')){localStorage.removeItem(LS);state=blank();closeModal();go('home');}">Erase all data</button>
    <p class="disc">Everything you enter stays on this device. Nothing is uploaded. Back up now and then so a cleared browser or a new phone can't lose it.</p>
    <div style="height:12px"></div>
    <button class="btn btn-primary btn-block" onclick="closeModal()">Done</button>
  `;
  document.getElementById('modalbg').classList.add('on');
}
function closeModal(){document.getElementById('modalbg').classList.remove('on');render();}
function backup(){const blob=new Blob([JSON.stringify(state)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hashi-backup-'+today()+'.json';a.click();}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{state=Object.assign(blank(),JSON.parse(r.result));save();closeModal();go('home');toast('Restored');}catch(e){alert('That file could not be read.');}};r.readAsText(f);}

/* ---------------- toast ---------------- */
function toast(msg){let t=document.createElement('div');t.textContent=msg;
  t.style.cssText='position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.2)';
  document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}

/* print styling */
const ps=document.createElement('style');
ps.textContent='@media print{header,nav.tabs,.tab,.btn,.disc{display:none!important}body{background:#fff;padding:0}.screen:not(.active){display:none}.card{box-shadow:none;border:1px solid #ddd}}'
+'.food-group{border-top:1px solid var(--line)}.food-group:first-of-type{border-top:none}'
+'.food-cat{display:flex;align-items:center;gap:8px;cursor:pointer;margin:0;padding:13px 2px}'
+'.food-cat>.fc-name{flex:1}'
+'.food-count{font-weight:700;color:var(--soft);text-transform:none;letter-spacing:0;font-size:12px;background:var(--bg1);border:1px solid var(--line);border-radius:999px;padding:1px 9px}'
+'.food-caret{color:var(--soft);font-size:12px;transition:transform .15s}'
+'.food-group.open .food-caret{transform:rotate(90deg)}'
+'.food-body{display:none;padding-bottom:4px}.food-group.open .food-body{display:block}';
document.head.appendChild(ps);

/* installable web app manifest (self-contained via blob) */
try{
  const icon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" rx="112" fill="#0E7C7B"/><text x="256" y="340" font-family="Georgia,serif" font-size="300" font-weight="700" fill="#F7F2E7" text-anchor="middle">H</text></svg>');
  const manifest={name:"HashiHelper: Hashimoto's Companion",short_name:"HashiHelper",start_url:".",display:"standalone",background_color:"#F7F2E7",theme_color:"#0E7C7B",icons:[{src:icon,sizes:"192x192",type:"image/svg+xml",purpose:"any"},{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  const murl=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
  const ml=document.createElement('link');ml.rel='manifest';ml.href=murl;document.head.appendChild(ml);
}catch(e){}

/* init */
renderHome();
maybeNotify();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)maybeNotify();});
</script>
</body>
</html>
